# Runs the whole test suite on Windows, Linux and macOS.
# Windows is the primary target; this is the only place it gets tested automatically.
# (Not yet run: written without access to a GitHub repository. If a job fails on the
#  ffmpeg setup step, that step is the first thing to look at.)
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # A hung test must not hold a runner for the 6-hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # setup-ffmpeg only supports x64; macos-latest is arm64, so use Homebrew there.
      - uses: FedericoCarboni/setup-ffmpeg@v3
        if: runner.os != 'macOS'
        id: ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Show tool versions
        run: |
          ffmpeg -version
          python --version
      - name: Install
        # The annotate plugin turns test failures into annotations, which can be read
        # without signing in (the raw job logs cannot).
        # pytest-timeout fails a test that runs over 5 minutes (and, with faulthandler_timeout,
        # every thread's stack is dumped first), so a hang names the stuck test.
        run: python -m pip install -e ".[dev]" pytest-github-actions-annotate-failures pytest-timeout
      - name: "Install a virtual display (Linux: the GUI tests need one)"
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Fast tests (no ffmpeg needed)
        run: python -m pytest -m "not integration" -q
      - name: All tests (Linux, under a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q --timeout=300 -o faulthandler_timeout=280
      - name: All tests
        if: runner.os != 'Linux'
        run: python -m pytest -q --timeout=300 -o faulthandler_timeout=280
