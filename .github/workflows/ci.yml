# Runs the whole test suite on Windows, Linux and macOS.
# Windows is the primary target; this is the only place it gets tested automatically.
# (Not yet run: written without access to a GitHub repository. If a job fails on the
#  ffmpeg setup step, that step is the first thing to look at.)
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: FedericoCarboni/setup-ffmpeg@v3
        id: ffmpeg
      - name: Show tool versions
        run: |
          ffmpeg -version
          python --version
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: "Install a virtual display (Linux: the GUI tests need one)"
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Fast tests (no ffmpeg needed)
        run: python -m pytest -m "not integration" -q
      - name: All tests (Linux, under a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q
      - name: All tests
        if: runner.os != 'Linux'
        run: python -m pytest -q
